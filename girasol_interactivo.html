<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego del Girasol de la Suerte</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b, #0f172a, #030712);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Instrucción inicial arriba */
    .instruction {
      position: absolute;
      top: 6%;
      font-size: 1.2rem;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
      animation: pulse 2s infinite;
      z-index: 20;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.95); opacity: 0.7; }
    }

    /* Recuadro para las frases cambiantes */
    .phrase-box {
      position: absolute;
      top: 15%;
      min-height: 50px;
      padding: 10px 25px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(250, 204, 21, 0.3);
      color: #fef08a;
      font-size: 1.1rem;
      text-align: center;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
      transition: opacity 0.3s, transform 0.3s;
      opacity: 0;
      z-index: 20;
    }

    .phrase-box.show {
      opacity: 1;
      transform: translateY(5px);
    }

    /* Escena del Girasol */
    .sunflower-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
    }

    /* Centro del Girasol */
    .center-disk {
      position: absolute;
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, #78350f, #451a03);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(120, 53, 15, 0.8), inset 0 0 10px #000;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px;
      font-size: 0.8rem;
      color: #facc15;
      font-weight: bold;
      transition: transform 0.8s, width 0.8s, height 0.8s;
    }

    /* Pétalos del Girasol */
    .petal {
      position: absolute;
      width: 32px;
      height: 120px;
      background: linear-gradient(to top, #facc15, #fef08a);
      border-radius: 50% 50% 20% 20%;
      transform-origin: bottom center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
      transition: transform 0.2s, filter 0.2s;
      z-index: 5;
    }

    .petal:hover {
      filter: brightness(1.2);
      transform: scale(1.05);
    }

    /* Animación del pétalo al caer */
    .petal.falling {
      pointer-events: none;
      animation: fallLeaf 2.5s forwards ease-in-out;
    }

    @keyframes fallLeaf {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(400px) rotate(180deg) scale(0.5);
      }
    }

    /* Carta del Mensaje Final */
    .card-letter {
      position: absolute;
      width: 360px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #facc15;
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.5);
      opacity: 0;
      transform: scale(0);
      transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s;
      z-index: 30;
      pointer-events: none;
    }

    .card-letter.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .card-letter h2 {
      color: #facc15;
      font-size: 1.3rem;
      margin-bottom: 12px;
      text-shadow: 0 0 8px #facc15;
    }

    .card-letter p {
      color: #f3f4f6;
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="instruction" id="instruction">🌻 Toca los pétalos para descubrir razones 🌻</div>
  
  <div class="phrase-box" id="phraseBox">¡Haz clic en un pétalo!</div>

  <div class="sunflower-container" id="sunflower">
    <div class="center-disk" id="centerDisk">✨</div>
  </div>

  <!-- Carta con el mensaje final -->
  <div class="card-letter" id="cardLetter">
    <h2>🌻 Feliz día de las flores amarillas 🌻</h2>
    <p>cada girasol que ves aquí es el latido de mi corazón.</p>
    <p>Así como el sol ilumina los campos, tú iluminas mi vida.</p>
    <p>Que estas flores te recuerden lo especial que eres.</p>
    <p style="margin-top: 10px; font-weight: bold; color: #facc15; font-size: 1rem;">Te quiero.</p>
  </div>

  <script>
    const phrases = [
      "Eres una persona increíble ✨",
      "Tu sonrisa ilumina cualquier lugar ☀️",
      "Amo cómo eres 💛",
      "Haces que los días sean especiales 🌻",
      "Eres única en el mundo 💫",
      "Gracias por existir 🌼",
      "Tu alegría contagia a todos 😊",
      "Siempre estás en mis pensamientos 💭",
      "Eres un sol brillante 🌞",
      "Me haces muy feliz ❤️"
    ];

    const totalPetals = phrases.length;
    let petalsRemoved = 0;

    const sunflower = document.getElementById('sunflower');
    const phraseBox = document.getElementById('phraseBox');
    const instruction = document.getElementById('instruction');

    // Construir el girasol con pétalos interactivos
    function buildSunflower() {
      for (let i = 0; i < totalPetals; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        
        // Rotación alrededor del centro
        const angle = (360 / totalPetals) * i;
        petal.style.transform = `rotate(${angle}deg) translateY(-50px)`;
        petal.dataset.angle = angle;
        
        // Guardar la rotación original para la animación
        petal.onclick = () => removePetal(petal, i);

        sunflower.appendChild(petal);
      }
    }

    function removePetal(petal, index) {
      if (petal.classList.contains('falling')) return;

      const angle = petal.dataset.angle;
      petal.classList.add('falling');
      
      // Aplicar caída con rotación
      petal.style.transform = `rotate(${angle}deg) translateY(350px) rotate(90deg)`;

      // Mostrar frase correspondiente
      phraseBox.innerText = phrases[index];
      phraseBox.classList.add('show');

      petalsRemoved++;

      // Cuando quiten todos los pétalos
      if (petalsRemoved === totalPetals) {
        setTimeout(() => {
          instruction.style.opacity = '0';
          phraseBox.style.opacity = '0';
          
          // Desplegar la carta central
          document.getElementById('cardLetter').classList.add('show');
        }, 1200);
      }
    }

    buildSunflower();
  </script>
</body>
</html>
